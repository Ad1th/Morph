# Morph project configuration.
#
# Cloud is a fallback, not a default (PRD section 25). A run only leaves this
# machine when the profile asks for more than this machine physically has --
# more RAM, more cores, another architecture or another OS -- because the
# alternative would be pretending to reproduce conditions we cannot.
#
# Check the routing decision and the worker at any time with:
#     morph cloud --profile target.json

version: "1.0"
default_trials: 5
significance_level: 0.05
proxy_port: 9876

adapters:
  network: proxy # user-space TCP proxy: works with no root, on every OS
  cpu: native
  memory: native
  locale: native

cloud:
  enabled: true
  provider: pi
  host: rbpi.local
  user: rbpi
  python: ~/morph/.venv/bin/python
  workdir: ~/morph

worker:
  enabled: true
  provider: pi
  host: rbpi.local
  user: rbpi
  python: ~/morph/.venv/bin/python
  workdir: ~/morph

