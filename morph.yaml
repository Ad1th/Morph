# Morph project configuration.
#
# Cloud is a fallback, not a default (PRD section 25). A run only leaves this
# machine when the profile asks for more than this machine physically has --
# more RAM, more cores, another architecture or another OS -- because the
# alternative would be pretending to reproduce conditions we cannot.
#
# Check the routing decision and the worker at any time with:
#     morph cloud --profile target.json

version: "1.0"
default_trials: 5
significance_level: 0.05
proxy_port: 9876

adapters:
  network: proxy # user-space TCP proxy: works with no root, on every OS
  cpu: native
  memory: native
  locale: native

cloud:
  # Flip to true once `morph cloud` reports the worker usable.
  enabled: false

  # Provenance only. The transport is SSH whoever supplies the box, so a GCP
  # instance, a Pi and a laptop across the room all work the same way.
  provider: gcp

  # The instance's EXTERNAL ip, from the GCP console.
  # Leave blank and export MORPH_CLOUD_HOST instead if you would rather not
  # commit it; the environment wins over this file either way.
  host: ""
  user: ""
  ssh_key: ~/.ssh/morph_gcp

  # Set by scripts/setup_gcp_worker.sh, which builds a venv on the worker.
  # A bare "python3" also works: Morph rewrites it to the interpreter it is
  # running under, which is how the worker gets Morph's own dependencies.
  python: ~/morph/.venv/bin/python
  workdir: ~/morph
