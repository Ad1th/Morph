[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morph"
version = "0.1.0"
description = "Test software in environments you don't physically have."
authors = [{name = "Adith"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",  # FastAPI requires it for multipart /projects/upload
    "uvicorn>=0.29.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=1.0.0",
    "psutil>=5.9.8",
    "py-cpuinfo>=9.0.0",
    "distro>=1.9.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
]

[project.scripts]
morph = "morph.cli.main:app"

[tool.setuptools.packages.find]
# Package only the library. `apps/` is a demo failure corpus (test fixtures),
# not part of the distribution; without this, setuptools flat-layout autodiscovery
# fails with "Multiple top-level packages discovered: ['apps', 'morph']".
include = ["morph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers used by the demo-app corpus under apps/ (see apps/conftest.py).
# --strict-markers makes a typo in a marker name a collection error instead of
# a silently unselected test.
addopts = "--strict-markers"
markers = [
    "slow: statistical corpus check over many trials (advisory in CI; run with -m slow)",
    "needs_linux: requires a Linux host (cgroup CPU quota, tc netem); skipped elsewhere",
    "needs_root: requires root privileges; skipped when unprivileged",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]
